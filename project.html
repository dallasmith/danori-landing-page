<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <title>Project updates</title>
  <link rel="icon" type="image/png" href="/images/favicon.png">
  <link rel="apple-touch-icon" href="/images/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --page: #F6F2EB;
      --card: #FFFFFF;
      --panel: #0E1F45;
      --blue: #015EF4;
      --ink: #1A1A1A;
      --muted: #5F6670;
      --panel-muted: #B8C2D3;
      --line: #EEE9E1;
      --green: #3B6D11;
      --shadow: 0 1px 3px rgba(20, 33, 61, 0.10);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--page);
      color: var(--ink);
      font-family: 'Inter Tight', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
      line-height: 1.5;
    }
    .wrap { max-width: 560px; margin: 0 auto; padding: 20px 16px 40px; }
    .brand { display: flex; align-items: center; gap: 8px; text-decoration: none; color: var(--ink); }
    .brand .logo-mark { width: 32px; height: 32px; display: block; }
    /* The site's logo is built at 48x48. Scale it to fit. */
    .brand .logo-mark > div { transform: scale(0.6667); transform-origin: top left; }
    .brand span { font-family: 'Space Grotesk', system-ui, sans-serif; font-weight: 700; font-size: 18px; }
    .from { font-size: 14px; color: var(--muted); margin: 18px 0 2px; }
    h1 { font-size: 26px; font-weight: 600; margin: 0; line-height: 1.2; }
    .address { font-size: 15px; color: var(--muted); margin: 2px 0 18px; }
    .panel { background: var(--panel); color: #F5F7FA; border-radius: 16px; padding: 18px; }
    .panel .state { font-size: 20px; font-weight: 600; margin: 0; }
    .panel .detail { font-size: 15px; color: var(--panel-muted); margin: 4px 0 0; }
    .label { font-size: 13px; font-weight: 600; color: #3B4048; margin: 26px 4px 8px; }
    .card { background: var(--card); border-radius: 14px; box-shadow: var(--shadow); padding: 4px 16px; }
    .row { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line); font-size: 15px; }
    .row:last-child { border-bottom: none; }
    .row .when { font-weight: 600; margin-right: 6px; }
    .ok { color: var(--green); white-space: nowrap; }
    .sched { color: var(--muted); white-space: nowrap; }
    .empty { color: var(--muted); font-size: 15px; padding: 12px 0; margin: 0; }
    .footer { text-align: center; font-size: 13px; color: var(--muted); margin-top: 32px; }
    .message { text-align: center; padding: 60px 8px; }
    .pct { margin: 14px 0 0; font-size: 15px; color: var(--panel-muted); }
    .pct span { font-size: 28px; font-weight: 600; color: #F5F7FA; margin-right: 4px; }
    .bar { height: 8px; background: rgba(255, 255, 255, 0.14); border-radius: 999px; margin-top: 8px; overflow: hidden; }
    .fill { height: 100%; width: 0; background: #4C8DFF; border-radius: 999px; }
    .phases { padding: 14px 16px 2px; }
    .phase { display: flex; gap: 12px; }
    .phase .rail { display: flex; flex-direction: column; align-items: center; width: 20px; flex: none; }
    .phase .dot { width: 18px; height: 18px; border-radius: 50%; flex: none; display: flex; align-items: center; justify-content: center; font-size: 11px; box-sizing: border-box; }
    .phase.done .dot { background: var(--line); color: var(--muted); }
    .phase.current .dot { background: var(--blue); box-shadow: 0 0 0 4px rgba(1, 94, 244, 0.18); }
    .phase.upcoming .dot { background: var(--card); border: 2px solid #C9C2B6; }
    .phase .line { width: 2px; flex: 1; min-height: 14px; background: var(--line); }
    .phase .name { padding: 0 0 14px; font-size: 15px; }
    .phase.done .name { color: var(--muted); }
    .phase.current .name { font-weight: 600; }
    .phase .now { display: block; font-size: 13px; font-weight: 500; color: var(--blue); }
    .weekLabel { font-size: 13px; color: var(--muted); margin: 6px 4px 6px; }
    .grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; margin-bottom: 10px; }
    .grid a { position: relative; display: block; aspect-ratio: 1; border-radius: 10px; overflow: hidden; background: var(--line); }
    .grid img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .grid .tag { position: absolute; left: 6px; bottom: 6px; font-size: 11px; color: #FFFFFF; background: rgba(0, 0, 0, 0.45); padding: 1px 6px; border-radius: 4px; }
    .message p { color: var(--muted); }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <main class="wrap">
    <a class="brand" href="/" aria-label="Danori">
      <div class="logo-mark">
          <div style="position:relative;width:48px;height:48px">
            <svg viewBox="0 0 100 100" width="48" height="48" style="display:block">
              <path d="M100.00 50.00 L99.93 66.53 L99.73 72.32 L99.39 76.56 L98.92 80.01 L98.31 82.93 L97.55 85.47 L96.65 87.70 L95.60 89.69 L94.39 91.44 L93.01 93.01 L91.44 94.39 L89.69 95.60 L87.70 96.65 L85.47 97.55 L82.93 98.31 L80.01 98.92 L76.56 99.39 L72.32 99.73 L66.53 99.93 L50.00 100.00 L33.47 99.93 L27.68 99.73 L23.44 99.39 L19.99 98.92 L17.07 98.31 L14.53 97.55 L12.30 96.65 L10.31 95.60 L8.56 94.39 L6.99 93.01 L5.61 91.44 L4.40 89.69 L3.35 87.70 L2.45 85.47 L1.69 82.93 L1.08 80.01 L0.61 76.56 L0.27 72.32 L0.07 66.53 L0.00 50.00 L0.07 33.47 L0.27 27.68 L0.61 23.44 L1.08 19.99 L1.69 17.07 L2.45 14.53 L3.35 12.30 L4.40 10.31 L5.61 8.56 L6.99 6.99 L8.56 5.61 L10.31 4.40 L12.30 3.35 L14.53 2.45 L17.07 1.69 L19.99 1.08 L23.44 0.61 L27.68 0.27 L33.47 0.07 L50.00 0.00 L66.53 0.07 L72.32 0.27 L76.56 0.61 L80.01 1.08 L82.93 1.69 L85.47 2.45 L87.70 3.35 L89.69 4.40 L91.44 5.61 L93.01 6.99 L94.39 8.56 L95.60 10.31 L96.65 12.30 L97.55 14.53 L98.31 17.07 L98.92 19.99 L99.39 23.44 L99.73 27.68 L99.93 33.47Z" fill="#015EF4"/>
            </svg>
            <div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center">
              <div style="width:22px;height:26px;border:4px solid #FFFFFF;border-radius:4px 13px 13px 4px;box-sizing:border-box"></div>
            </div>
          </div>
      </div>
      <span>Danori</span>
    </a>

    <div id="loading" class="message"><p>Loading your project…</p></div>

    <div id="error" class="message" hidden>
      <h1>This link isn't active</h1>
      <p>Ask your builder for a new one.</p>
    </div>

    <div id="content" hidden>
      <p class="from" id="from"></p>
      <h1 id="projectName"></h1>
      <p class="address" id="address"></p>

      <section class="panel" aria-live="polite">
        <p class="state" id="state"></p>
        <p class="detail" id="detail"></p>
        <div id="progress" hidden>
          <p class="pct"><span id="pctNum"></span>complete</p>
          <div class="bar"><div class="fill" id="pctFill"></div></div>
        </div>
      </section>

      <p class="label">This week</p>
      <div class="card" id="thisWeek"></div>

      <div id="comingSection" hidden>
        <p class="label">Coming up</p>
        <div class="card" id="comingUp"></div>
      </div>

      <div id="phasesSection" hidden>
        <p class="label">Project phases</p>
        <div class="card phases" id="phases"></div>
      </div>

      <div id="photosSection" hidden>
        <p class="label">Photos</p>
        <div id="photos"></div>
      </div>

      <div id="changesSection" hidden>
        <p class="label">Changes to your project</p>
        <div class="card" id="changes"></div>
      </div>

      <p class="footer" id="footer"></p>
    </div>
  </main>

  <script>
    (function () {
      var FUNCTION_URL = "https://asyophwoqgqpdeblpnfp.supabase.co/functions/v1/client-page";

      function el(id) { return document.getElementById(id); }

      function showError() {
        el("loading").hidden = true;
        el("content").hidden = true;
        el("error").hidden = false;
      }

      // "2026-10-05" -> "Mon, Oct 5" (read as a calendar date, no time zone shift)
      function niceDate(ymd) {
        var p = String(ymd).slice(0, 10).split("-");
        var d = new Date(Number(p[0]), Number(p[1]) - 1, Number(p[2]));
        return d.toLocaleDateString("en-US", { weekday: "short", month: "short", day: "numeric" });
      }

      // "2026-10-05" -> "Oct 5"
      function shortDate(ymd) {
        var p = String(ymd).slice(0, 10).split("-");
        var d = new Date(Number(p[0]), Number(p[1]) - 1, Number(p[2]));
        return d.toLocaleDateString("en-US", { month: "short", day: "numeric" });
      }

      function money(cents) {
        var abs = Math.abs(cents) / 100;
        var text = abs.toLocaleString("en-US", {
          style: "currency", currency: "USD",
          minimumFractionDigits: abs % 1 === 0 ? 0 : 2, maximumFractionDigits: 2
        });
        return cents < 0 ? "Credit " + text : "+" + text;
      }

      // Builds a row with text only (never HTML), so builder-typed names can't break the page
      function row(leftBold, leftText, rightText, rightClass) {
        var r = document.createElement("div");
        r.className = "row";
        var left = document.createElement("span");
        if (leftBold) {
          var b = document.createElement("span");
          b.className = "when";
          b.textContent = leftBold;
          left.appendChild(b);
        }
        left.appendChild(document.createTextNode(leftText));
        var right = document.createElement("span");
        right.className = rightClass;
        right.textContent = rightText;
        r.appendChild(left);
        r.appendChild(right);
        return r;
      }

      var parts = window.location.pathname.split("/");
      var token = (parts[2] || "").toLowerCase();
      if (!/^[0-9a-f]{64}$/.test(token)) { showError(); return; }

      var tz = "UTC";
      try { tz = Intl.DateTimeFormat().resolvedOptions().timeZone || "UTC"; } catch (e) {}

      fetch(FUNCTION_URL + "?t=" + encodeURIComponent(token) + "&tz=" + encodeURIComponent(tz), { cache: "no-store" })
        .then(function (res) { if (!res.ok) throw new Error("not found"); return res.json(); })
        .then(function (data) {
          var builder = data.builderName || "your builder";
          document.title = (data.projectName || "Project") + " updates";
          el("from").textContent = "Project updates from " + builder;
          el("projectName").textContent = data.projectName || "Your project";
          el("address").textContent = data.address || "";

          // Status: never "behind" or "on schedule"
          if (data.status === "paused") {
            el("state").textContent = "Paused for now";
            el("detail").textContent = "Your builder will share the next steps.";
          } else if (data.status === "complete") {
            el("state").textContent = "Complete";
            el("detail").textContent = "Finished " + niceDate(data.finishDate);
          } else if (data.status === "not_started") {
            el("state").textContent = "Starting " + niceDate(data.startDate);
            el("detail").textContent = "Expected to finish " + niceDate(data.finishDate);
          } else {
            el("state").textContent = "In progress";
            el("detail").textContent = "Week " + data.weekNow + " of " + data.weekTotal +
              " · Expected to finish " + niceDate(data.finishDate);
          }

          // Percent complete (never "behind")
          if (typeof data.percentComplete === "number" && data.status !== "not_started") {
            var pct = Math.max(0, Math.min(100, Math.round(data.percentComplete)));
            el("pctNum").textContent = pct + "% ";
            el("pctFill").style.width = pct + "%";
            el("progress").hidden = false;
          }

          // This week
          var week = el("thisWeek");
          if (!data.thisWeek || data.thisWeek.length === 0) {
            var none = document.createElement("p");
            none.className = "empty";
            none.textContent = "Nothing scheduled this week.";
            week.appendChild(none);
          } else {
            data.thisWeek.forEach(function (t) {
              var when = niceDate(t.date);
              if (t.endDate && t.endDate !== t.date) when += " to " + niceDate(t.endDate);
              week.appendChild(row(when, " · " + t.label,
                t.confirmed ? "✓ Confirmed" : "Scheduled",
                t.confirmed ? "ok" : "sched"));
            });
          }

          // Coming up: exact date if confirmed, "Scheduled for" if not
          var coming = Array.isArray(data.comingUp) ? data.comingUp : (data.nextUp ? [data.nextUp] : []);
          if (coming.length > 0) {
            el("comingSection").hidden = false;
            coming.forEach(function (t) {
              el("comingUp").appendChild(row("", t.label,
                (t.confirmed ? "Starts " : "Scheduled for ") + niceDate(t.date),
                t.confirmed ? "ok" : "sched"));
            });
          }

          // Phase timeline: done grayed with a check, current in blue, upcoming open
          var phases = Array.isArray(data.phases) ? data.phases : [];
          if (phases.length > 0) {
            el("phasesSection").hidden = false;
            phases.forEach(function (p, i) {
              var state = p.state === "done" ? "done" : (p.state === "current" ? "current" : "upcoming");
              var item = document.createElement("div");
              item.className = "phase " + state;
              var rail = document.createElement("div");
              rail.className = "rail";
              var dot = document.createElement("span");
              dot.className = "dot";
              if (state === "done") dot.textContent = "✓";
              rail.appendChild(dot);
              if (i < phases.length - 1) {
                var line = document.createElement("span");
                line.className = "line";
                rail.appendChild(line);
              }
              var name = document.createElement("div");
              name.className = "name";
              name.textContent = p.name;
              if (state === "current") {
                var now = document.createElement("span");
                now.className = "now";
                now.textContent = "Happening now";
                name.appendChild(now);
              }
              item.appendChild(rail);
              item.appendChild(name);
              el("phases").appendChild(item);
            });
          }

          // Photos the builder chose to share, newest week first. Tap to open full size.
          var photos = Array.isArray(data.photos) ? data.photos : [];
          if (photos.length > 0) {
            el("photosSection").hidden = false;
            var lastWeek = null, grid = null;
            photos.forEach(function (ph) {
              if (!/^https:\/\//.test(String(ph.url))) return;
              if (ph.weekOf !== lastWeek || !grid) {
                lastWeek = ph.weekOf;
                var wl = document.createElement("p");
                wl.className = "weekLabel";
                wl.textContent = "Week of " + shortDate(ph.weekOf);
                el("photos").appendChild(wl);
                grid = document.createElement("div");
                grid.className = "grid";
                el("photos").appendChild(grid);
              }
              var a = document.createElement("a");
              a.href = ph.url;
              a.target = "_blank";
              a.rel = "noopener noreferrer";
              var img = document.createElement("img");
              img.src = ph.url;
              img.loading = "lazy";
              img.alt = "Project photo" + (ph.label ? ": " + ph.label : "");
              a.appendChild(img);
              if (ph.label) {
                var tag = document.createElement("span");
                tag.className = "tag";
                tag.textContent = ph.label;
                a.appendChild(tag);
              }
              grid.appendChild(a);
            });
          }

          // Approved changes
          if (data.changeOrders && data.changeOrders.length > 0) {
            el("changesSection").hidden = false;
            data.changeOrders.forEach(function (c) {
              el("changes").appendChild(row("", c.title, money(c.amountCents), "sched"));
            });
          }

          el("footer").textContent = "Shared by " + builder + " using Danori";
          el("loading").hidden = true;
          el("content").hidden = false;
        })
        .catch(showError);
    })();
  </script>
</body>
</html>
